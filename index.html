title:["Маркетинг","Marketing","Մարքեթինգ"],
intro:["Как товар находит своего покупателя? Узнайте, как работает маркетинг и почему он есть в нашей повседневной жизни.","How does a product find its buyer? Learn how marketing works and why it is part of everyday life.","Ինչպե՞ս է ապրանքը գտնում իր գնորդին։ Իմացեք, թե ինչպես է աշխատում մարքեթինգը և ինչու է այն մեր առօրյայի մասը։"],
why:["Маркетинг помогает понять, что нужно людям, и вовремя предложить это.","Marketing helps us understand what people need and offer it at the right time.","Մարքեթինգն օգնում է հասկանալ՝ ինչ է պետք մարդկանց, և ժամանակին առաջարկել դա։"],
chart:["Возраст брендов (лет)","Brand age (years)","Բրենդների տարիքը (տարի)"],
w0:["Определение|Маркетинг — это изучение потребностей людей и создание, оценка и продвижение товаров, которые эти потребности удовлетворяют.","Definition|Marketing is studying people's needs and creating, pricing and promoting goods that satisfy them.","Սահմանում|Մարքեթինգը մարդկանց կարիքների ուսումնասիրումն է և դրանք բավարարող ապրանքների ստեղծումը, գնագոյացումն ու առաջխաղացումը։"],
w1:["Цели|Привлечь клиентов, увеличить продажи, создать узнаваемый бренд и сохранить лояльность покупателей.","Goals|Attract customers, increase sales, build a recognisable brand and keep customers loyal.","Նպատակներ|Գրավել հաճախորդներին, մեծացնել վաճառքը, ստեղծել ճանաչելի բրենդ և պահպանել գնորդների հավատարմությունը։"],

w3:["Влияние на людей|Реклама помогает выбирать, но может подталкивать к лишним покупкам, поэтому важно думать критически.","Effect on people|Ads help us choose, but can push us to buy more than we need, so think critically.","Ազդեցությունը մարդկանց վրա|Գովազդն օգնում է ընտրել, բայց կարող է դրդել ավելորդ գնումների, ուստի կարևոր է քննադատաբար մտածել։"],
w4:["Пример|Магазин рядом со школой в августе продаёт тетради со скидкой — это и есть маркетинг.","Example|A shop near a school sells notebooks at a discount in August — that is marketing.","Օրինակ|Դպրոցի մոտ գտնվող խանութը օգոստոսին տետրեր է վաճառում զեղչով. սա էլ մարքեթինգ է։"],
t0:["Продвижение через интернет и гаджеты. Пример: реклама в поиске Google.","Promotion through the internet and devices. Example: Google search ads.","Առաջխաղացում ինտերնետի և սարքերի միջոցով։ Օրինակ՝ Google-ի որոնման գովազդ։"],
t1:["Полезные статьи, видео и подкасты привлекают клиентов. Пример: медиа Red Bull.","Useful articles, videos and podcasts attract customers. Example: Red Bull media.","Օգտակար հոդվածներ, տեսանյութեր և պոդկաստներ գրավում են հաճախորդներին։ Օրինակ՝ Red Bull-ի մեդիան։"],
t2:["Работа с аудиторией в Instagram, TikTok, Facebook. Пример: конкурсы в соцсетях.","Working with audiences on Instagram, TikTok and Facebook. Example: social media contests.","Աշխատանք լսարանի հետ Instagram-ում, TikTok-ում և Facebook-ում։ Օրինակ՝ սոցցանցերի մրցույթներ։"],
t3:["Рекомендации известных блогеров. Пример: обзор наушников от блогера.","Recommendations from popular bloggers. Example: a blogger's headphone review.","Հայտնի բլոգերների խորհուրդներ։ Օրինակ՝ բլոգերի ականջակալների ակնարկ։"],

t5:["Оптимизация сайта, чтобы он был выше в поиске. Пример: сайт магазина в топе Google.","Optimising a website to rank higher in search. Example: a shop site at the top of Google.","Կայքի օպտիմիզացում, որպեսզի այն որոնման արդյունքներում բարձր լինի։ Օրինակ՝ խանութի կայքը Google-ի առաջին տողերում։"],
t6:["ТВ, радио, газеты, плакаты. Пример: ролик по телевизору.","TV, radio, newspapers, posters. Example: a TV commercial.","Հեռուստատեսություն, ռադիո, թերթեր, պաստառներ։ Օրինակ՝ հեռուստահոլովակ։"],
t7:["Необычные идеи с малым бюджетом. Пример: рисунок на тротуаре, удивляющий прохожих.","Unusual low-budget ideas. Example: pavement art that surprises passers-by.","Անսովոր գաղափարներ փոքր բյուջեով։ Օրինակ՝ մայթի նկար, որը զարմացնում է անցորդներին։"],
p0:["Продукт","Product","Ապրանք"],p1:["Цена","Price","Գին"],p2:["Место распространения","Place","Վաճառքի վայր"],p3:["Продвижение","Promotion","Խթանում"],
m0:["Товар или услуга, решающая проблему покупателя. Пример: iPhone объединяет телефон, камеру и компьютер.","A good or service that solves a customer's problem. Example: the iPhone combines phone, camera and computer.","Ապրանք կամ ծառայություն, որը լուծում է գնորդի խնդիրը։ Օրինակ՝ iPhone-ը միավորում է հեռախոսը, տեսախցիկը և համակարգիչը։"],

m2:["Где и как покупатель может купить товар. Пример: тысячи ресторанов McDonald's по всему миру.","Where and how customers can buy the product. Example: thousands of McDonald's restaurants worldwide.","Որտեղ և ինչպես կարելի է գնել ապրանքը։ Օրինակ՝ McDonald's-ի հազարավոր ռեստորաններ ամբողջ աշխարհում։"],
m3:["Способы рассказать о товаре: реклама, акции, соцсети. Пример: слоган Nike «Just Do It».","Ways to tell people about a product: ads, sales, social media. Example: Nike's “Just Do It”.","Ապրանքի մասին պատմելու ձևեր՝ գովազդ, ակցիաներ, սոցցանցեր։ Օրինակ՝ Nike-ի «Just Do It» կարգախոսը։"],
u0:["Целевая аудитория — группа людей, для которых создан товар. Рынок делят на сегменты, чтобы лучше понимать каждую группу.","The target audience is the group of people a product is made for. The market is split into segments to understand each group better.","Թիրախային լսարանը մարդկանց խումբն է, ում համար ստեղծված է ապրանքը։ Շուկան բաժանում են հատվածների՝ յուրաքանչյուր խումբը լավ հասկանալու համար։"],
u1:["Возраст|Подросткам нужны телефоны и игры, пожилым — удобство и забота.","Age|Teenagers want phones and games; older people want comfort and care.","Տարիք|Դեռահասներին պետք են հեռախոսներ և խաղեր, տարեցներին՝ հարմարավետություն և հոգատարություն։"],

a0:["Телевидение|Ролик видят миллионы зрителей сразу, но эфир стоит дорого. Пример: рекламные ролики Coca-Cola.","Television|Millions see a commercial at once, but airtime is expensive. Example: Coca-Cola commercials.","Հեռուստատեսություն|Հոլովակը միանգամից տեսնում են միլիոնավոր մարդիկ, բայց եթերը թանկ է։ Օրինակ՝ Coca-Cola-ի հոլովակները։"],
a1:["Наружная реклама|Билборды и плакаты на улицах видят все прохожие. Пример: билборды McDonald's.","Outdoor|Billboards and posters on the street are seen by every passer-by. Example: McDonald's billboards.","Արտաքին գովազդ|Փողոցների վահանակներն ու պաստառները տեսնում են բոլոր անցորդները։ Օրինակ՝ McDonald's-ի վահանակները։"],
a2:["Интернет-реклама|Можно показать объявление именно тем, кто ищет товар. Пример: реклама в Google и YouTube.","Online ads|An ad can be shown exactly to people who search for the product. Example: Google and YouTube ads.","Ինտերնետ գովազդ|Հայտարարությունը կարելի է ցույց տալ հենց նրանց, ովքեր փնտրում են ապրանքը։ Օրինակ՝ Google-ի և YouTube-ի գովազդ։"],
a3:["Социальные сети|Бренд общается с людьми напрямую. Пример: аккаунты Nike в Instagram.","Social media|A brand talks to people directly. Example: Nike's Instagram accounts.","Սոցիալական ցանցեր|Բրենդը անմիջապես շփվում է մարդկանց հետ։ Օրինակ՝ Nike-ի Instagram էջերը։"],
a4:["Influencer Marketing|Блогеры рекомендуют товары своим подписчикам, и им доверяют. Пример: обзоры техники.","Influencer Marketing|Bloggers recommend products to followers who trust them. Example: tech reviews.","Influencer Marketing|Բլոգերները ապրանքներ են խորհուրդ տալիս իրենց հետևորդներին, ովքեր վստահում են նրանց։ Օրինակ՝ տեխնիկայի ակնարկներ։"],
a5:["Печатная реклама|Журналы, газеты и листовки сохраняются и читаются долго. Пример: реклама в журнале.","Print|Magazines, newspapers and flyers can be kept and read for a long time. Example: a magazine ad.","Տպագիր գովազդ|Ամսագրերը, թերթերը և թռուցիկները երկար են պահվում և կարդացվում։ Օրինակ՝ ամսագրի գովազդ։"],

d1:["Выясняем, кто наши клиенты, чего они хотят и где проводят время.","We find out who our customers are, what they want and where they spend time.","Պարզում ենք՝ ովքեր են մեր հաճախորդները, ինչ են ուզում և որտեղ են անցկացնում ժամանակը։"],

d4:["Рассказываем о товаре через рекламу, соцсети и акции.","We tell people about the product through ads, social media and offers.","Ապրանքի մասին պատմում ենք գովազդի, սոցցանցերի և ակցիաների միջոցով։"],
